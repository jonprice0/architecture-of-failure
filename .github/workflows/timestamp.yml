# Stamps the edition with OpenTimestamps and commits the proofs back.
#
# Why this exists: the maintainer's build environment reaches only the package
# registries and GitHub, so `ots stamp` cannot reach the calendar servers from
# there. A GitHub runner can. This workflow is therefore the only place the
# timestamp proofs can be produced, and it is machinery, not part of the record:
# nothing here is covered by SHA256SUMS.
name: timestamp

on:
  push:
    branches: [main]
  workflow_dispatch:

# No `paths:` filter. A force-push or a history rewrite does not evaluate a
# paths filter the way an ordinary push does, so the stamps silently went
# stale once. Every push to main re-stamps instead; the bot's own commits
# carry [skip ci], so this does not loop.

permissions:
  contents: write

concurrency:
  group: timestamp
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the OpenTimestamps client
        run: pip install --quiet opentimestamps-client

      - name: Stamp only what is unproved or stale
        run: |
          set -eu
          # An existing VALID proof is never discarded. The earliest timestamp on
          # a given set of bytes is the valuable one, and wiping every proof on
          # each push would keep re-dating files that have not changed — which
          # would have thrown away this edition's pre-publication timestamps the
          # first time the card was edited. A proof that does NOT match the file
          # beside it is worse than none, because it reads as evidence, so those
          # are replaced. The proofs stay beside their targets: `ots verify X.ots`
          # resolves its target as the .ots path minus the suffix.
          need=()
          for f in SHA256SUMS \
                   "The Architecture of Failure — complete edition.md" \
                   "01 The Yaowarat Partita.md" \
                   "02 The Architecture of Failure — main text.md" \
                   "03 Log 1.md" "04 Log 2.md" "05 Log 3.md" "06 Log 4.md" "07 Log 5.md" \
                   "08 Project Charter (publication copy).md"; do
            if [ ! -f "$f.ots" ]; then
              echo "unproved:  $f"; need+=("$f"); continue
            fi
            claimed=$(ots info "$f.ots" | sed -n 's/^File sha256 hash: //p')
            actual=$(sha256sum "$f" | cut -d' ' -f1)
            if [ "$claimed" != "$actual" ]; then
              echo "stale:     $f"; rm -f "$f.ots"; need+=("$f")
            else
              echo "keeping:   $f.ots"
            fi
          done
          if [ ${#need[@]} -eq 0 ]; then echo "every proof current; nothing to do"; exit 0; fi
          ots stamp "${need[@]}"
          ls -la ./*.ots

      # Proposed twice in the handoff and not built until now: the machine, not
      # a person's memory, should be what notices a stale proof. This runs
      # before the commit, so a bad proof is never pushed.
      - name: Verify every proof describes the file beside it
        run: |
          chmod +x .github/verify-proofs.sh
          .github/verify-proofs.sh

      - name: Commit the pending proofs
        run: |
          set -eu
          git config user.name  "opentimestamps (github actions)"
          git config user.email "actions@github.com"
          git add ./*.ots
          git diff --cached --quiet && { echo "no new proofs"; exit 0; }
          git commit -m "OpenTimestamps: pending proofs for the edition [skip ci]"
          chmod +x .github/push-with-rebase.sh
          .github/push-with-rebase.sh
